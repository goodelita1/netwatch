# NetWatch — Nginx reverse proxy с HTTPS
# Файл: /etc/nginx/sites-available/netwatch
#
# Установка:
#   sudo ln -s /etc/nginx/sites-available/netwatch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;          # принимаем любое имя / IP

    # ACME challenge (Let's Encrypt) — убрать если используется self-signed
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ── SSL сертификат ────────────────────────────────────────────────────────
    # Self-signed (сгенерированный setup_https.sh):
    ssl_certificate     /etc/ssl/netwatch/cert.pem;
    ssl_certificate_key /etc/ssl/netwatch/key.pem;

    # Let's Encrypt (раскомментировать если есть домен):
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── Современные TLS настройки ─────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:CHACHA20;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              off;   # off для self-signed, on для Let's Encrypt

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin" always;

    # ── Proxy к Flask ─────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support (для будущего Flask-SocketIO)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передаём реальный IP клиента
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты (увеличены для SNMP /traffic endpoint который ждёт 4с)
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        # Буферизация — отключить для SSE/WebSocket
        proxy_buffering off;
    }

    # ── Статика напрямую через nginx (быстрее) ────────────────────────────────
    location /static/ {
        alias /opt/netwatch/static/;     # ← поменяй на свой путь
        expires 1d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Защита внутренних путей ───────────────────────────────────────────────
    location ~ /\.                { deny all; }
    location ~ \.(db|bak)$        { deny all; }  # .json must NOT be blocked — breaks PWA manifest
    location /backups/             { deny all; }
}