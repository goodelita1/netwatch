<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NetWatch — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d1117;--sf:#111827;--bd:#1e2a3a;--text:#e2e8f0;--muted:#4a5568;--acc:#3d7fff;--red:#ff3d57;--green:#00e676;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);
    background-size:40px 40px;opacity:.27;}
  .card{position:relative;z-index:1;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;}
  .logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
  .logo-icon{width:42px;height:42px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;}
  h1 span{color:var(--acc);}
  .sub{font-size:10px;color:var(--muted);margin-top:2px;}
  .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
  label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
  input{background:var(--bg);border:1px solid var(--bd);color:var(--text);padding:10px 13px;border-radius:8px;font-family:inherit;font-size:13px;outline:none;transition:border-color .18s;width:100%;}
  input:focus{border-color:var(--acc);}
  .btn{width:100%;padding:11px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;background:var(--acc);color:#fff;transition:all .18s;margin-top:4px;}
  .btn:hover{background:#5590ff;transform:translateY(-1px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .err{color:var(--red);font-size:11px;margin-top:10px;min-height:16px;text-align:center;}
  .hint{font-size:10px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">⬡</div>
    <div>
      <h1>Net<span>Watch</span></h1>
      <div class="sub">Мониторинг сетевой инфраструктуры</div>
    </div>
  </div>
  <div class="fg">
    <label>Логин</label>
    <input id="username" type="text" placeholder="admin" autocomplete="username" autofocus>
  </div>
  <div class="fg">
    <label>Пароль</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Войти</button>
  <div class="err" id="errMsg"></div>
  <div class="hint">По умолчанию: <b>admin</b> / <b>netwatch</b><br>Смените пароль в ⚙️ Настройки после входа.</div>
</div>
<script>
async function doLogin(){
  const btn=document.getElementById('loginBtn');
  const err=document.getElementById('errMsg');
  btn.disabled=true; btn.textContent='Вход...'; err.textContent='';
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      username:document.getElementById('username').value.trim(),
      password:document.getElementById('password').value
    })});
  if(r.ok){window.location.href='/';}
  else{
    const d=await r.json();
    err.textContent=d.error||'Ошибка входа';
    btn.disabled=false; btn.textContent='Войти';
  }
}
</script>
</body>
</html>
